"28" y="768" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="767" font-size="10" font-weight="400" fill="#222" text-anchor="start">Each project title is a link to its detail page. When there are no projects an empty</text><text x="42" y="780" font-size="10" font-weight="400" fill="#222" text-anchor="start">state explains what to do. Lists are real &lt;ul&gt; lists.</text><circle cx="538" cy="764" r="8" fill="#c0392b"/><text x="538" y="768" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="767" font-size="10" font-weight="400" fill="#222" text-anchor="start">Form pattern used everywhere: a real label with (required) or (optional) in text, a</text><text x="552" y="780" font-size="10" font-weight="400" fill="#222" text-anchor="start">hint, a live character counter, and an error shown as an icon plus text, tied to the</text><text x="552" y="793" font-size="10" font-weight="400" fill="#222" text-anchor="start">field with aria-describedby and aria-invalid. A failed submit moves focus to the first</text><text x="552" y="806" font-size="10" font-weight="400" fill="#222" text-anchor="start">problem and announces how many fields need attention.</text></svg>