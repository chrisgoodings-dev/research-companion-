"#fff" text-anchor="middle">1</text><text x="42" y="881" font-size="10" font-weight="400" fill="#222" text-anchor="start">Live filtering: results update as you type or choose, with no submit button. The panel</text><text x="42" y="894" font-size="10" font-weight="400" fill="#222" text-anchor="start">is a role="search" container, and the filters are kept in the address (replaceState,</text><text x="42" y="907" font-size="10" font-weight="400" fill="#222" text-anchor="start">so no history entry per keystroke). The count is a polite status region, updated after</text><text x="42" y="920" font-size="10" font-weight="400" fill="#222" text-anchor="start">a short pause so typing is not announced letter by letter.</text><circle cx="538" cy="878" r="8" fill="#c0392b"/><text x="538" y="882" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="881" font-size="10" font-weight="400" fill="#222" text-anchor="start">A chip per project shows status as text ("Read · Reviewed"). An empty library, and "no</text><text x="552" y="894" font-size="10" font-weight="400" fill="#222" text-anchor="start">matches" with a Clear filters button, each have their own state.</text></svg>