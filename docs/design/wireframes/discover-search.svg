<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="955" viewBox="0 0 1040 955" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="26" font-size="18" font-weight="700" fill="#111">Discover: search form</text><text x="20" y="44" font-size="11" fill="#555">Route #/discover   ·   js/views/discover.js</text><text x="20" y="62" font-size="10" font-weight="700" fill="#666">DESKTOP AND TABLET (768px and wider)</text><text x="780" y="62" font-size="10" font-weight="700" fill="#666">PHONE (320px)</text><rect x="20" y="70" width="720" height="486" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><rect x="20" y="70" width="118" height="486" rx="0" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="32" y="94" font-size="10.5" font-weight="700" fill="#fff" text-anchor="start">SE Research Hub</text><text x="36" y="123" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Dashboard</text><text x="36" y="149" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Projects</text><rect x="26" y="160" width="106" height="22" rx="3" fill="#666" stroke="none" stroke-width="1"/><text x="36" y="175" font-size="10" font-weight="700" fill="#fff" text-anchor="start">Discover</text><text x="36" y="201" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Library</text><text x="36" y="227" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Evidence</text><text x="36" y="253" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Matrix</text><text x="36" y="279" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Progress</text><text x="32" y="542" font-size="9.5" font-weight="400" fill="#ccc" text-anchor="start">Backup &amp; export</text><line x1="26" y1="528" x2="132" y2="528" stroke="#666" stroke-width="1"/><rect x="628" y="80" width="98" height="22" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="677" y="95" font-size="9.5" font-weight="700" fill="#222" text-anchor="middle">Dark theme</text><text x="154" y="130" font-size="17" font-weight="700" fill="#222" text-anchor="start">Discover</text><text x="154" y="158" font-size="10" font-weight="400" fill="#555" text-anchor="start">Search scholarly papers through OpenAlex and Crossref, then save the useful ones to a project.</text><rect x="154" y="173" width="570" height="298" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="164" y="193" font-size="10" font-weight="700" fill="#222" text-anchor="start">Search for papers (required)</text><text x="164" y="206" font-size="9" font-weight="400" fill="#777" text-anchor="start">Keywords or a phrase, for example "AI code generation productivity".</text><rect x="164" y="212" width="550" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="170" y="227" font-size="10" font-weight="400" fill="#555" text-anchor="start">ai code generation</text><text x="698" y="227" font-size="12" font-weight="400" fill="#222" text-anchor="start">⌕</text><rect x="164" y="248" width="550" height="100" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><rect x="172" y="242" width="48.5" height="12" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="176" y="252" font-size="10" font-weight="700" fill="#222" text-anchor="start">Filters</text><text x="172" y="264" font-size="10" font-weight="700" fill="#222" text-anchor="start">Earliest year (optional)</text><text x="172" y="277" font-size="9" font-weight="400" fill="#777" text-anchor="start">A four-digit year, e.g. 2020.</text><rect x="172" y="283" width="171.33333333333334" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="178" y="298" font-size="10" font-weight="400" fill="#555" text-anchor="start">2020</text><text x="353.33333333333337" y="264" font-size="10" font-weight="700" fill="#222" text-anchor="start">Latest year (optional)</text><text x="353.33333333333337" y="277" font-size="9" font-weight="400" fill="#777" text-anchor="start">A four-digit year, e.g. 2024.</text><rect x="353.33333333333337" y="283" width="171.33333333333334" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="359.33333333333337" y="298" font-size="10" font-weight="400" fill="#555" text-anchor="start">2024</text><text x="534.6666666666667" y="264" font-size="10" font-weight="700" fill="#222" text-anchor="start">Sort by</text><text x="534.6666666666667" y="277" font-size="9" font-weight="400" fill="#777" text-anchor="start">How results are ordered.</text><rect x="534.6666666666667" y="283" width="171.33333333333334" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="540.6666666666667" y="298" font-size="10" font-weight="400" fill="#555" text-anchor="start">Relevance</text><text x="692.0000000000001" y="298" font-size="10" font-weight="400" fill="#222" text-anchor="start">▾</text><circle cx="161" cy="262" r="8" fill="#c0392b"/><text x="161" y="266" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="172" y="314" width="11" height="11" rx="2" fill="#fff" stroke="#333" stroke-width="1"/><text x="174" y="323" font-size="10" font-weight="700" fill="#222" text-anchor="start">✓</text><text x="189" y="323" font-size="10" font-weight="700" fill="#222" text-anchor="start">Open access only</text><text x="189" y="335" font-size="9" font-weight="400" fill="#777" text-anchor="start">Only papers that can be read for free. Crossref is skipped when this is on.</text><circle cx="161" cy="321" r="8" fill="#c0392b"/><text x="161" y="325" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="164" y="362" width="550" height="69" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><rect x="172" y="356" width="48.5" height="12" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="176" y="366" font-size="10" font-weight="700" fill="#222" text-anchor="start">Sources</text><text x="172" y="378" font-size="9" font-weight="400" fill="#777" text-anchor="start">Choose at least one. Results are merged and duplicates (same DOI) combined.</text><rect x="172" y="392" width="11" height="11" rx="2" fill="#fff" stroke="#333" stroke-width="1"/><text x="174" y="401" font-size="10" font-weight="700" fill="#222" text-anchor="start">✓</text><text x="189" y="401" font-size="10" font-weight="700" fill="#222" text-anchor="start">OpenAlex</text><rect x="172" y="408" width="11" height="11" rx="2" fill="#fff" stroke="#333" stroke-width="1"/><text x="174" y="417" font-size="10" font-weight="700" fill="#222" text-anchor="start">✓</text><text x="189" y="417" font-size="10" font-weight="700" fill="#222" text-anchor="start">Crossref</text><circle cx="161" cy="399" r="8" fill="#c0392b"/><text x="161" y="403" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="164" y="439" width="55.400000000000006" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="191.7" y="454" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Search</text><circle cx="153" cy="447" r="8" fill="#c0392b"/><text x="153" y="451" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="143" cy="181" r="8" fill="#c0392b"/><text x="143" y="185" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="154" y="479" width="570" height="57" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="164" y="501" font-size="12" font-weight="700" fill="#222" text-anchor="start">Results</text><text x="164" y="521" font-size="10" font-weight="400" fill="#555" text-anchor="start">Enter a search above to find papers.</text><rect x="780" y="70" width="240" height="697" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><rect x="780" y="70" width="240" height="34" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="792" y="92" font-size="10" font-weight="700" fill="#fff" text-anchor="start">SE Research Hub</text><rect x="942" y="77" width="68" height="20" rx="4" fill="#3b3b3b" stroke="#ddd" stroke-width="1"/><text x="976" y="91" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Dark theme</text><rect x="780" y="729" width="240" height="38" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="810" y="752" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Dashboard</text><rect x="844" y="733" width="52" height="30" rx="4" fill="#666" stroke="none" stroke-width="1"/><text x="870" y="752" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Discover</text><text x="930" y="752" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Library</text><text x="990" y="752" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Menu</text><text x="792" y="132" font-size="17" font-weight="700" fill="#222" text-anchor="start">Discover</text><text x="792" y="160" font-size="10" font-weight="400" fill="#555" text-anchor="start">Search scholarly papers through OpenAlex</text><text x="792" y="173" font-size="10" font-weight="400" fill="#555" text-anchor="start">and Crossref, then save the useful ones</text><text x="792" y="186" font-size="10" font-weight="400" fill="#555" text-anchor="start">to a project.</text><rect x="792" y="201" width="216" height="453" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="221" font-size="10" font-weight="700" fill="#222" text-anchor="start">Search for papers (required)</text><text x="802" y="234" font-size="9" font-weight="400" fill="#777" text-anchor="start">Keywords or a phrase, for example "AI</text><text x="802" y="245" font-size="9" font-weight="400" fill="#777" text-anchor="start">code generation productivity".</text><rect x="802" y="251" width="196" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="808" y="266" font-size="10" font-weight="400" fill="#555" text-anchor="start">ai code generation</text><text x="982" y="266" font-size="12" font-weight="400" fill="#222" text-anchor="start">⌕</text><rect x="802" y="287" width="196" height="218" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><rect x="810" y="281" width="48.5" height="12" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="814" y="291" font-size="10" font-weight="700" fill="#222" text-anchor="start">Filters</text><text x="810" y="303" font-size="10" font-weight="700" fill="#222" text-anchor="start">Earliest year (optional)</text><text x="810" y="316" font-size="9" font-weight="400" fill="#777" text-anchor="start">A four-digit year, e.g. 2020.</text><rect x="810" y="322" width="180" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="816" y="337" font-size="10" font-weight="400" fill="#555" text-anchor="start">2020</text><text x="810" y="362" font-size="10" font-weight="700" fill="#222" text-anchor="start">Latest year (optional)</text><text x="810" y="375" font-size="9" font-weight="400" fill="#777" text-anchor="start">A four-digit year, e.g. 2024.</text><rect x="810" y="381" width="180" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="816" y="396" font-size="10" font-weight="400" fill="#555" text-anchor="start">2024</text><text x="810" y="421" font-size="10" font-weight="700" fill="#222" text-anchor="start">Sort by</text><text x="810" y="434" font-size="9" font-weight="400" fill="#777" text-anchor="start">How results are ordered.</text><rect x="810" y="440" width="180" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="816" y="455" font-size="10" font-weight="400" fill="#555" text-anchor="start">Relevance</text><text x="976" y="455" font-size="10" font-weight="400" fill="#222" text-anchor="start">▾</text><circle cx="799" cy="301" r="8" fill="#c0392b"/><text x="799" y="305" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="810" y="471" width="11" height="11" rx="2" fill="#fff" stroke="#333" stroke-width="1"/><text x="812" y="480" font-size="10" font-weight="700" fill="#222" text-anchor="start">✓</text><text x="827" y="480" font-size="10" font-weight="700" fill="#222" text-anchor="start">Open access only</text><text x="827" y="492" font-size="9" font-weight="400" fill="#777" text-anchor="start">Only papers that can be read for free. Crossref is skipped when this is on.</text><circle cx="799" cy="478" r="8" fill="#c0392b"/><text x="799" y="482" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="802" y="519" width="196" height="95" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><rect x="810" y="513" width="48.5" height="12" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="814" y="523" font-size="10" font-weight="700" fill="#222" text-anchor="start">Sources</text><text x="810" y="535" font-size="9" font-weight="400" fill="#777" text-anchor="start">Choose at least one. Results are</text><text x="810" y="548" font-size="9" font-weight="400" fill="#777" text-anchor="start">merged and duplicates (same DOI)</text><text x="810" y="561" font-size="9" font-weight="400" fill="#777" text-anchor="start">combined.</text><rect x="810" y="575" width="11" height="11" rx="2" fill="#fff" stroke="#333" stroke-width="1"/><text x="812" y="584" font-size="10" font-weight="700" fill="#222" text-anchor="start">✓</text><text x="827" y="584" font-size="10" font-weight="700" fill="#222" text-anchor="start">OpenAlex</text><rect x="810" y="591" width="11" height="11" rx="2" fill="#fff" stroke="#333" stroke-width="1"/><text x="812" y="600" font-size="10" font-weight="700" fill="#222" text-anchor="start">✓</text><text x="827" y="600" font-size="10" font-weight="700" fill="#222" text-anchor="start">Crossref</text><circle cx="799" cy="582" r="8" fill="#c0392b"/><text x="799" y="586" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="802" y="622" width="55.400000000000006" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="829.7" y="637" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Search</text><circle cx="791" cy="630" r="8" fill="#c0392b"/><text x="791" y="634" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="781" cy="209" r="8" fill="#c0392b"/><text x="781" y="213" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="792" y="662" width="216" height="57" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="684" font-size="12" font-weight="700" fill="#222" text-anchor="start">Results</text><text x="802" y="704" font-size="10" font-weight="400" fill="#555" text-anchor="start">Enter a search above to find papers.</text><text x="20" y="797" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="816" r="8" fill="#c0392b"/><text x="28" y="820" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="819" font-size="10" font-weight="400" fill="#222" text-anchor="start">The form is a role="search" landmark. The keyword box is type="search"</text><text x="42" y="832" font-size="10" font-weight="400" fill="#222" text-anchor="start">(enterkeyhint="search") and required, 2 to 200 characters.</text><circle cx="538" cy="816" r="8" fill="#c0392b"/><text x="538" y="820" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="819" font-size="10" font-weight="400" fill="#222" text-anchor="start">Year fields are type="number" with min, max, step and numeric keyboard on phones. A</text><text x="552" y="832" font-size="10" font-weight="400" fill="#222" text-anchor="start">cross-field rule (earliest not after latest) puts a specific error on the second</text><text x="552" y="845" font-size="10" font-weight="400" fill="#222" text-anchor="start">field. On a phone the three fields stack.</text><circle cx="28" cy="860" r="8" fill="#c0392b"/><text x="28" y="864" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="863" font-size="10" font-weight="400" fill="#222" text-anchor="start">A single checkbox for a yes/no filter, with its explanation as a described hint.</text><circle cx="538" cy="873" r="8" fill="#c0392b"/><text x="538" y="877" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="552" y="876" font-size="10" font-weight="400" fill="#222" text-anchor="start">Checkbox group sharing one name (read back as a list). At least one source is</text><text x="552" y="889" font-size="10" font-weight="400" fill="#222" text-anchor="start">required; otherwise the error appears on the first checkbox.</text><circle cx="28" cy="891" r="8" fill="#c0392b"/><text x="28" y="895" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="42" y="894" font-size="10" font-weight="400" fill="#222" text-anchor="start">Searching updates the address (?q=...&amp;from=...&amp;oa=1...), so a search can be</text><text x="42" y="907" font-size="10" font-weight="400" fill="#222" text-anchor="start">bookmarked, shared and restored with the Back button. The results area announces the</text><text x="42" y="920" font-size="10" font-weight="400" fill="#222" text-anchor="start">count to screen readers.</text></svg>