dth="2"/><rect x="780" y="70" width="240" height="34" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="792" y="92" font-size="10" font-weight="700" fill="#fff" text-anchor="start">SE Research Hub</text><rect x="942" y="77" width="68" height="20" rx="4" fill="#3b3b3b" stroke="#ddd" stroke-width="1"/><text x="976" y="91" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Dark theme</text><rect x="780" y="726" width="240" height="38" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><rect x="784" y="730" width="52" height="30" rx="4" fill="#666" stroke="none" stroke-width="1"/><text x="810" y="749" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Dashboard</text><text x="870" y="749" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Discover</text><text x="930" y="749" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Library</text><text x="990" y="749" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Menu</text><text x="792" y="132" font-size="17" font-weight="700" fill="#222" text-anchor="start">Page not found</text><circle cx="781" cy="124" r="8" fill="#c0392b"/><text x="781" y="128" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="792" y="160" font-size="10" font-weight="400" fill="#555" text-anchor="start">That address does not match a page in SE</text><text x="792" y="173" font-size="10" font-weight="400" fill="#555" text-anchor="start">Research Hub: #/no-such-page.</text><rect x="792" y="188" width="216" height="92" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="210" font-size="12" font-weight="700" fill="#222" text-anchor="start">Where would you like to go?</text><rect x="802" y="220" width="73.1" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="838.55" y="235" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Dashboard</text><rect x="881.1" y="220" width="67.2" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="914.7" y="235" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Projects</text><rect x="802" y="248" width="108.5" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="856.25" y="263" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Discover papers</text><text x="792" y="301" font-size="13" font-weight="700" fill="#222" text-anchor="start">Empty state (Library)</text><circle cx="781" cy="296" r="8" fill="#c0392b"/><text x="781" y="300" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="792" y="318" width="216" height="113" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="340" font-size="12" font-weight="700" fill="#222" text-anchor="start">Your library is empty</text><text x="802" y="360" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">Search for papers in Discover and save</text><text x="802" y="373" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">the useful ones to a project. They</text><text x="802" y="386" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">will appear here.</text><rect x="802" y="399" width="84.9" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="844.45" y="414" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Find papers</text><text x="792" y="452" font-size="13" font-weight="700" fill="#222" text-anchor="start">Search failed</text><circle cx="781" cy="447" r="8" fill="#c0392b"/><text x="781" y="451" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="792" y="469" width="216" height="113" rx="4" fill="#fff" stroke="#a11d33" stroke-width="1.5" stroke-dasharray="5 3"/><text x="802" y="491" font-size="12" font-weight="700" fill="#222" text-anchor="start">Search failed</text><text x="802" y="511" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">The search service is busy (too many</text><text x="802" y="524" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">requests). Wait a moment and try</text><text x="802" y="537" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">again.</text><rect x="802" y="550" width="73.1" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="838.55" y="565" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Try again</text><text x="792" y="603" font-size="13" font-weight="700" fill="#222" text-anchor="start">Storage blocked</text><circle cx="781" cy="598" r="8" fill="#c0392b"/><text x="781" y="602" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="792" y="620" width="216" height="96" rx="4" fill="#fff" stroke="#a11d33" stroke-width="1.5" stroke-dasharray="5 3"/><text x="802" y="642" font-size="12" font-weight="700" fill="#222" text-anchor="start">This section could not load</text><text x="802" y="662" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">IndexedDB is not available in this</text><text x="802" y="675" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">browser. Your browser may be blocking</text><text x="802" y="688" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">local storage (for example in a</text><text x="802" y="701" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">private window).</text><text x="20" y="794" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="813" r="8" fill="#c0392b"/><text x="28" y="817" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="816" font-size="10" font-weight="400" fill="#222" text-anchor="start">The unknown-address page keeps the same layout and navigation, shows the address as</text><text x="42" y="829" font-size="10" font-weight="400" fill="#222" text-anchor="start">escaped text, and offers ways back. The heading still receives focus.</text><circle cx="538" cy="813" r="8" fill="#c0392b"/><text x="538" y="817" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="816" font-size="10" font-weight="400" fill="#222" text-anchor="start">Every list has an explained empty state with the next step as a button, never a blank</text><text x="552" y="829" font-size="10" font-weight="400" fill="#222" text-anchor="start">area.</text><circle cx="28" cy="857" r="8" fill="#c0392b"/><text x="28" y="861" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="860" font-size="10" font-weight="400" fill="#222" text-anchor="start">API failures are specific (offline, busy, timed out, server error, unexpected reply),</text><text x="42" y="873" font-size="10" font-weight="400" fill="#222" text-anchor="start">role="alert", with a Try again button. A failure is never shown as "no results".</text><circle cx="538" cy="857" r="8" fill="#c0392b"/><text x="538" y="861" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="552" y="860" font-size="10" font-weight="400" fill="#222" text-anchor="start">If browser storage is unavailable, each page keeps its heading and explains the</text><text x="552" y="873" font-size="10" font-weight="400" fill="#222" text-anchor="start">problem instead of crashing; Discover still searches and says saving is unavailable.</text></svg>