22" text-anchor="start">Progress: what to read and record</text><text x="812" y="654" font-size="10" font-weight="400" fill="#222" text-anchor="start">next</text><text x="802" y="670" font-size="10" font-weight="400" fill="#222" text-anchor="start">•</text><text x="812" y="670" font-size="10" font-weight="400" fill="#222" text-anchor="start">Evidence: everything you have</text><text x="812" y="683" font-size="10" font-weight="400" fill="#222" text-anchor="start">recorded</text><text x="802" y="706" font-size="9" font-weight="400" fill="#777" text-anchor="start" font-style="italic">Last backup: 3 Oct 2026. Back up now</text><circle cx="791" cy="705" r="8" fill="#c0392b"/><text x="791" y="709" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="1012" cy="727" r="8" fill="#c0392b"/><text x="1012" y="731" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="20" y="799" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="818" r="8" fill="#c0392b"/><text x="28" y="822" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="821" font-size="10" font-weight="400" fill="#222" text-anchor="start">One &lt;h1&gt; per page, and the page title (document title) changes with the route. On</text><text x="42" y="834" font-size="10" font-weight="400" fill="#222" text-anchor="start">every route change focus moves to this heading and the page name is announced.</text><circle cx="538" cy="818" r="8" fill="#c0392b"/><text x="538" y="822" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="821" font-size="10" font-weight="400" fill="#222" text-anchor="start">Four live counts read from IndexedDB, in a list. Large figures with text labels. On a</text><text x="552" y="834" font-size="10" font-weight="400" fill="#222" text-anchor="start">phone they wrap to two columns.</text><circle cx="28" cy="862" r="8" fill="#c0392b"/><text x="28" y="866" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="865" font-size="10" font-weight="400" fill="#222" text-anchor="start">Plain-language orientation for a first visit. Two columns on desktop, stacked on a</text><text x="42" y="878" font-size="10" font-weight="400" fill="#222" text-anchor="start">phone.</text><circle cx="538" cy="862" r="8" fill="#c0392b"/><text x="538" y="866" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="552" y="865" font-size="10" font-weight="400" fill="#222" text-anchor="start">Reminder of the last backup date (the only protection for data stored in the browser).</text><circle cx="28" cy="906" r="8" fill="#c0392b"/><text x="28" y="910" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="42" y="909" font-size="10" font-weight="400" fill="#222" text-anchor="start">Navigation: persistent sidebar on desktop with a footer link to Backup and export; on</text><text x="42" y="922" font-size="10" font-weight="400" fill="#222" text-anchor="start">a phone a bottom bar (Dashboard, Discover, Library, Menu). The skip link is the first</text><text x="42" y="935" font-size="10" font-weight="400" fill="#222" text-anchor="start">focusable element on every page.</text></svg>