<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="817" viewBox="0 0 1040 817" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="26" font-size="18" font-weight="700" fill="#111">Overlays: dialogs, menu sheet and toasts</text><text x="20" y="44" font-size="11" fill="#555">Not pages: opened from within pages  ·  js/ui/confirm.js, js/ui/saveDialog.js, js/ui/toast.js, js/ui/announcer.js</text><text x="20" y="60" font-size="10" font-weight="700" fill="#666" text-anchor="start">CONFIRM DIALOG (delete, replace, discard)</text><rect x="20" y="70" width="320" height="330" rx="0" fill="#9a9a9a" stroke="#222" stroke-width="2"/><text x="30" y="90" font-size="9" font-weight="400" fill="#fff" text-anchor="start" font-style="italic">page behind is inert and dimmed</text><rect x="50" y="150" width="260" height="123" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="64" y="176" font-size="12" font-weight="700" fill="#222" text-anchor="start">Delete “AI-assisted coding”?</text><text x="64" y="196" font-size="10" font-weight="400" fill="#333" text-anchor="start">This also deletes 3 research questions, 2</text><text x="64" y="209" font-size="10" font-weight="400" fill="#333" text-anchor="start">saved paper links and any linked evidence.</text><text x="64" y="222" font-size="10" font-weight="400" fill="#333" text-anchor="start">This cannot be undone.</text><rect x="61" y="232" width="63.400000000000006" height="28" rx="6" fill="none" stroke="#c0392b" stroke-width="2.5"/><rect x="64" y="235" width="57.400000000000006" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="92.7" y="250" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Cancel</text><rect x="131.4" y="235" width="104.60000000000001" height="22" rx="4" fill="#fff" stroke="#a11d33" stroke-width="1.5"/><text x="183.70000000000002" y="250" font-size="10" font-weight="700" fill="#a11d33" text-anchor="middle">Delete project</text><circle cx="42" cy="158" r="8" fill="#c0392b"/><text x="42" y="162" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="360" y="60" font-size="10" font-weight="700" fill="#666" text-anchor="start">SAVE TO PROJECT DIALOG (Discover)</text><rect x="360" y="70" width="320" height="330" rx="0" fill="#9a9a9a" stroke="#222" stroke-width="2"/><rect x="390" y="140" width="260" height="175" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="404" y="166" font-size="12" font-weight="700" fill="#222" text-anchor="start">Save to project</text><text x="404" y="184" font-size="9.5" font-weight="700" fill="#222" text-anchor="start">Project (required)</text><text x="404" y="195" font-size="9" font-weight="400" fill="#777" text-anchor="start">Productivity Assessment of Neural Code</text><text x="404" y="206" font-size="9" font-weight="400" fill="#777" text-anchor="start">Completion</text><rect x="404" y="213" width="232" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="410" y="228" font-size="10" font-weight="400" fill="#555" text-anchor="start">AI-assisted coding</text><text x="622" y="228" font-size="10" font-weight="400" fill="#222" text-anchor="start">▾</text><text x="404" y="251" font-size="10" font-weight="400" fill="#333" text-anchor="start">A paper can be saved to more than one</text><text x="404" y="264" font-size="10" font-weight="400" fill="#333" text-anchor="start">project.</text><rect x="401" y="274" width="63.400000000000006" height="28" rx="6" fill="none" stroke="#c0392b" stroke-width="2.5"/><rect x="404" y="277" width="57.400000000000006" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="432.7" y="292" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Cancel</text><rect x="471.4" y="277" width="81" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="511.9" y="292" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Save paper</text><circle cx="382" cy="148" r="8" fill="#c0392b"/><text x="382" y="152" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="700" y="60" font-size="10" font-weight="700" fill="#666" text-anchor="start">MENU SHEET (phones only)</text><rect x="740" y="70" width="240" height="330" rx="10" fill="#9a9a9a" stroke="#222" stroke-width="2"/><rect x="760" y="130" width="200" height="223" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="774" y="156" font-size="12" font-weight="700" fill="#222" text-anchor="start">More</text><rect x="774" y="170" width="172" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><text x="784" y="186" font-size="10" font-weight="700" fill="#222" text-anchor="start">Projects</text><rect x="774" y="199" width="172" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><text x="784" y="215" font-size="10" font-weight="700" fill="#222" text-anchor="start">Evidence</text><rect x="774" y="228" width="172" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><text x="784" y="244" font-size="10" font-weight="700" fill="#222" text-anchor="start">Matrix</text><rect x="774" y="257" width="172" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><text x="784" y="273" font-size="10" font-weight="700" fill="#222" text-anchor="start">Progress</text><rect x="774" y="286" width="172" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><text x="784" y="302" font-size="10" font-weight="700" fill="#222" text-anchor="start">Backup &amp; export</text><rect x="774" y="319" width="110" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="829" y="334" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Close menu</text><circle cx="752" cy="138" r="8" fill="#c0392b"/><text x="752" y="142" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="740" y="362" width="240" height="38" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="770" y="385" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Dashboard</text><text x="830" y="385" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Discover</text><text x="890" y="385" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Library</text><text x="950" y="385" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Menu</text><text x="20" y="440" font-size="10" font-weight="700" fill="#666" text-anchor="start">TOAST (a brief confirmation)</text><rect x="20" y="450" width="480" height="150" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><rect x="28" y="458" width="464" height="16" rx="0" fill="#eee" stroke="#bbb" stroke-width="1"/><text x="34" y="470" font-size="9" font-weight="400" fill="#777" text-anchor="start">page content (the toast sits at the TOP so it never covers a Save button)</text><rect x="320" y="480" width="172" height="28" rx="6" fill="#222" stroke="#222" stroke-width="1"/><text x="406" y="498" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Evidence added</text><circle cx="312" cy="488" r="8" fill="#c0392b"/><text x="312" y="492" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="28" y="524" width="464" height="64" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/><text x="36" y="540" font-size="9" font-weight="700" fill="#222" text-anchor="start">Polite live region (visually hidden, always present):</text><text x="36" y="554" font-size="9" font-weight="400" fill="#333" text-anchor="start">“Evidence added”  “3 results for copilot. Page 1 of 62.”  “Review saved”</text><text x="36" y="568" font-size="9" font-weight="400" fill="#333" text-anchor="start">“Projects page” (on every route change, with focus moved to the heading)</text><circle cx="28" cy="530" r="8" fill="#c0392b"/><text x="28" y="534" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="20" y="620" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="639" r="8" fill="#c0392b"/><text x="28" y="643" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="642" font-size="10" font-weight="400" fill="#222" text-anchor="start">Native &lt;dialog&gt; opened with showModal(): focus is trapped inside, the page behind is</text><text x="42" y="655" font-size="10" font-weight="400" fill="#222" text-anchor="start">inert, Esc cancels, and focus returns to the button that opened it. CANCEL is the first</text><text x="42" y="668" font-size="10" font-weight="400" fill="#222" text-anchor="start">button and receives initial focus (red ring), so pressing Enter by mistake never</text><text x="42" y="681" font-size="10" font-weight="400" fill="#222" text-anchor="start">destroys data. Used for delete, replace-everything and discard-unsaved-changes.</text><circle cx="548" cy="639" r="8" fill="#c0392b"/><text x="548" y="643" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="562" y="642" font-size="10" font-weight="400" fill="#222" text-anchor="start">The same dialog pattern for choosing a project when saving a paper. The last-used</text><text x="562" y="655" font-size="10" font-weight="400" fill="#222" text-anchor="start">project is preselected; projects that already contain the paper are not offered.</text><circle cx="28" cy="709" r="8" fill="#c0392b"/><text x="28" y="713" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="712" font-size="10" font-weight="400" fill="#222" text-anchor="start">The phone Menu button opens the same kind of dialog with the destinations that do not</text><text x="42" y="725" font-size="10" font-weight="400" fill="#222" text-anchor="start">fit in the bottom bar. Choosing a link closes it.</text><circle cx="548" cy="683" r="8" fill="#c0392b"/><text x="548" y="687" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="562" y="686" font-size="10" font-weight="400" fill="#222" text-anchor="start">Toasts appear at the top of the screen for six seconds. They are marked aria-hidden so</text><text x="562" y="699" font-size="10" font-weight="400" fill="#222" text-anchor="start">they are never read twice; they are a visual confirmation only.</text><circle cx="28" cy="753" r="8" fill="#c0392b"/><text x="28" y="757" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="42" y="756" font-size="10" font-weight="400" fill="#222" text-anchor="start">The announcement is made through one polite live region that exists from page load:</text><text x="42" y="769" font-size="10" font-weight="400" fill="#222" text-anchor="start">search results, saves, deletes, route changes and project changes in the matrix and</text><text x="42" y="782" font-size="10" font-weight="400" fill="#222" text-anchor="start">progress pages.</text></svg>