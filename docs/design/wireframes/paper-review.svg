xt x="814" y="288" font-size="10" font-weight="700" fill="#222" text-anchor="start">Reading status</text><circle cx="816" cy="297" r="5" fill="#fff" stroke="#333"/><text x="826" y="300" font-size="10" font-weight="700" fill="#222" text-anchor="start">Unread</text><circle cx="816" cy="312" r="5" fill="#fff" stroke="#333"/><circle cx="816" cy="312" r="2.5" fill="#333"/><text x="826" y="315" font-size="10" font-weight="700" fill="#222" text-anchor="start">Reading</text><circle cx="816" cy="327" r="5" fill="#fff" stroke="#333"/><text x="826" y="330" font-size="10" font-weight="700" fill="#222" text-anchor="start">Read</text><circle cx="791" cy="286" r="8" fill="#c0392b"/><text x="791" y="290" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="802" y="361" font-size="10" font-weight="700" fill="#222" text-anchor="start">Study aim (optional)</text><text x="802" y="374" font-size="9" font-weight="400" fill="#777" text-anchor="start">What question did the authors set out to</text><text x="802" y="385" font-size="9" font-weight="400" fill="#777" text-anchor="start">answer?</text><rect x="802" y="391" width="196" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="998" y="438" font-size="8.5" font-weight="400" fill="#777" text-anchor="end">0 / 2000</text><text x="802" y="458" font-size="10" font-weight="700" fill="#222" text-anchor="start">Methodology (optional)</text><text x="802" y="471" font-size="9" font-weight="400" fill="#777" text-anchor="start">Study design, how data was collected and</text><text x="802" y="482" font-size="9" font-weight="400" fill="#777" text-anchor="start">how it was analysed.</text><rect x="802" y="488" width="196" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="998" y="535" font-size="8.5" font-weight="400" fill="#777" text-anchor="end">0 / 2000</text><text x="802" y="555" font-size="10" font-weight="700" fill="#222" text-anchor="start">Participants or dataset (optional)</text><rect x="802" y="560" width="196" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="998" y="607" font-size="8.5" font-weight="400" fill="#777" text-anchor="end">0 / 2000</text><text x="802" y="627" font-size="10" font-weight="700" fill="#222" text-anchor="start">Key findings (optional)</text><text x="802" y="640" font-size="9" font-weight="400" fill="#777" text-anchor="start">What the paper reports, in its own</text><text x="802" y="651" font-size="9" font-weight="400" fill="#777" text-anchor="start">terms. Put your own interpretation in</text><text x="802" y="662" font-size="9" font-weight="400" fill="#777" text-anchor="start">the notes below.</text><rect x="802" y="668" width="196" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="998" y="715" font-size="8.5" font-weight="400" fill="#777" text-anchor="end">0 / 2000</text><text x="802" y="735" font-size="10" font-weight="700" fill="#222" text-anchor="start">Limitations and threats to validity (optional)</text><rect x="802" y="740" width="196" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="998" y="787" font-size="8.5" font-weight="400" fill="#777" text-anchor="end">0 / 2000</text><text x="802" y="807" font-size="10" font-weight="700" fill="#222" text-anchor="start">General notes (optional)</text><text x="802" y="820" font-size="9" font-weight="400" fill="#777" text-anchor="start">Anything else worth remembering,</text><text x="802" y="831" font-size="9" font-weight="400" fill="#777" text-anchor="start">including your own interpretation.</text><rect x="802" y="837" width="196" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="998" y="884" font-size="8.5" font-weight="400" fill="#777" text-anchor="end">0 / 2000</text><rect x="802" y="894" width="84.9" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="844.45" y="909" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Save review</text><text x="802" y="933" font-size="9" font-weight="400" fill="#777" text-anchor="start" font-style="italic">Last saved 4 Oct 2026</text><circle cx="791" cy="902" r="8" fill="#c0392b"/><text x="791" y="906" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="20" y="1026" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="1045" r="8" fill="#c0392b"/><text x="28" y="1049" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="1048" font-size="10" font-weight="400" fill="#222" text-anchor="start">Reading status is a radio group in a fieldset with a legend: three mutually exclusive</text><text x="42" y="1061" font-size="10" font-weight="400" fill="#222" text-anchor="start">options that are all visible at once, so a select would hide information the user</text><text x="42" y="1074" font-size="10" font-weight="400" fill="#222" text-anchor="start">needs. The control group has one Tab stop; arrow keys move within it.</text><circle cx="538" cy="1045" r="8" fill="#c0392b"/><text x="538" y="1049" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="1048" font-size="10" font-weight="400" fill="#222" text-anchor="start">The hint separates what the paper reports from the researcher's own reading, which</text><text x="552" y="1061" font-size="10" font-weight="400" fill="#222" text-anchor="start">carries into the evidence model (evidence and interpretation are separate fields).</text><circle cx="28" cy="1102" r="8" fill="#c0392b"/><text x="28" y="1106" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="1105" font-size="10" font-weight="400" fill="#222" text-anchor="start">One review per paper per project, stored on the project link. "Last saved" gives</text><text x="42" y="1118" font-size="10" font-weight="400" fill="#222" text-anchor="start">feedback in text; saving also announces "Review saved". A "written" review means at</text><text x="42" y="1131" font-size="10" font-weight="400" fill="#222" text-anchor="start">least one field has text.</text></svg>