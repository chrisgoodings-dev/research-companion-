ont-weight="700" fill="#222" text-anchor="start" text-decoration="underline">for Human Pair-programming?</text><text x="802" y="582" font-size="10" font-weight="700" fill="#222" text-anchor="start">Ranim Khojah, Mazen Mohamad</text><text x="802" y="596" font-size="9" font-weight="400" fill="#666" text-anchor="start">2023 · Journal of Systems &amp; Software</text><rect x="802" y="601" width="71.2" height="15" rx="7" fill="#fff" stroke="#555" stroke-width="1"/><text x="837.6" y="611.5" font-size="8.5" font-weight="400" fill="#222" text-anchor="middle">Cited by 87</text><text x="802" y="631" font-size="9" font-weight="400" fill="#777" text-anchor="start">Found in: OpenAlex</text><line x1="802" y1="638" x2="998" y2="638" stroke="#ccc" stroke-width="1"/><rect x="802" y="644" width="153.70000000000002" height="20" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="878.85" y="658" font-size="9" font-weight="700" fill="#222" text-anchor="middle">Save to another project</text><text x="802" y="682" font-size="9" font-weight="700" fill="#222" text-anchor="start">Saved to: AI-assisted coding</text><rect x="792" y="708" width="67.2" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="825.6" y="723" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Previous</text><rect x="865.2" y="708" width="43.6" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="887" y="723" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Next</text><text x="20" y="808" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="827" r="8" fill="#c0392b"/><text x="28" y="831" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="830" font-size="10" font-weight="400" fill="#222" text-anchor="start">Results live in a section with aria-busy while loading. A loading message, "no</text><text x="42" y="843" font-size="10" font-weight="400" fill="#222" text-anchor="start">results" advice and specific error messages with a Try again button cover every state.</text><circle cx="538" cy="827" r="8" fill="#c0392b"/><text x="538" y="831" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="830" font-size="10" font-weight="400" fill="#222" text-anchor="start">The count is shown AND announced through a polite live region. "About" appears when</text><text x="552" y="843" font-size="10" font-weight="400" fill="#222" text-anchor="start">two sources were merged, because the overlap cannot be known.</text><circle cx="28" cy="871" r="8" fill="#c0392b"/><text x="28" y="875" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="874" font-size="10" font-weight="400" fill="#222" text-anchor="start">If one source fails the other's results are still shown with this notice. A failure</text><text x="42" y="887" font-size="10" font-weight="400" fill="#222" text-anchor="start">never looks like "no results".</text><circle cx="538" cy="871" r="8" fill="#c0392b"/><text x="538" y="875" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="552" y="874" font-size="10" font-weight="400" fill="#222" text-anchor="start">Each card: title link (opens a new tab, with that said in text), authors, year and</text><text x="552" y="887" font-size="10" font-weight="400" fill="#222" text-anchor="start">venue, open-access status as TEXT, citation count, abstract in a native &lt;details&gt;, DOI</text><text x="552" y="900" font-size="10" font-weight="400" fill="#222" text-anchor="start">link, and which sources found it. The saved state is text ("Saved to: ..."), never</text><text x="552" y="913" font-size="10" font-weight="400" fill="#222" text-anchor="start">colour alone. Paging moves focus to the Results heading.</text></svg>