l="#222" text-anchor="middle">Publisher page</text><rect x="802" y="749" width="143.9" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="873.95" y="764" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Open-access full text</text><text x="802" y="790" font-size="11" font-weight="700" fill="#222" text-anchor="start">Saved in</text><rect x="802" y="805" width="246.20000000000002" height="16" rx="8" fill="#fff" stroke="#777" stroke-width="1"/><text x="925.1" y="816" font-size="9" font-weight="400" fill="#222" text-anchor="middle">AI-assisted coding: Read · saved 4 Oct 2026</text><rect x="802" y="825" width="197.60000000000002" height="16" rx="8" fill="#fff" stroke="#777" stroke-width="1"/><text x="900.8" y="836" font-size="9" font-weight="400" fill="#222" text-anchor="middle">Security of generated code: Unread</text><text x="20" y="929" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="948" r="8" fill="#c0392b"/><text x="28" y="952" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="951" font-size="10" font-weight="400" fill="#222" text-anchor="start">Tabs follow the WAI-ARIA tabs pattern: a tablist of tab buttons, one tabpanel each.</text><text x="42" y="964" font-size="10" font-weight="400" fill="#222" text-anchor="start">Only the selected tab is in the Tab order (roving tabindex); Left and Right move</text><text x="42" y="977" font-size="10" font-weight="400" fill="#222" text-anchor="start">between tabs, Home and End jump to the first and last; the selected tab is shown by</text><text x="42" y="990" font-size="10" font-weight="400" fill="#222" text-anchor="start">weight, an underline bar AND colour. The chosen tab and project are kept in the</text><text x="42" y="1003" font-size="10" font-weight="400" fill="#222" text-anchor="start">address (?tab=review&amp;project=...).</text><circle cx="538" cy="948" r="8" fill="#c0392b"/><text x="538" y="952" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="951" font-size="10" font-weight="400" fill="#222" text-anchor="start">Facts as a description list (term and definition). External links say in text that</text><text x="552" y="964" font-size="10" font-weight="400" fill="#222" text-anchor="start">they open a new tab. Every dynamic value is escaped. The project picker appears only</text><text x="552" y="977" font-size="10" font-weight="400" fill="#222" text-anchor="start">when the paper is saved in more than one project, and asks before discarding unsaved</text><text x="552" y="990" font-size="10" font-weight="400" fill="#222" text-anchor="start">text.</text></svg>