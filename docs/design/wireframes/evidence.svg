" text-anchor="middle">✓ Supports</text><text x="162" y="425" font-size="9.5" font-weight="700" fill="#222" text-anchor="start">Does AI code generation improve developer productivity?</text><text x="162" y="441" font-size="9" font-weight="400" fill="#555" text-anchor="start" text-decoration="underline">Paper: Productivity Assessment of Neural Code Completion</text><rect x="162" y="447" width="554" height="32" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1"/><line x1="162" y1="447" x2="162" y2="479" stroke="#333" stroke-width="4"/><text x="170" y="458" font-size="8" font-weight="700" fill="#666" text-anchor="start">FROM THE PAPER</text><text x="170" y="470" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">Developers completed the task 55% faster (n = 95).</text><rect x="162" y="484" width="554" height="32" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1"/><line x1="162" y1="484" x2="162" y2="516" stroke="#333" stroke-width="3" stroke-dasharray="3 2"/><text x="170" y="495" font-size="8" font-weight="700" fill="#666" text-anchor="start">YOUR INTERPRETATION</text><text x="170" y="507" font-size="9.5" font-weight="400" fill="#222" text-anchor="start">Strong effect, but a single small lab task.</text><rect x="162" y="521" width="78.80000000000001" height="15" rx="7" fill="#fff" stroke="#777" stroke-width="1"/><text x="201.4" y="531.5" font-size="8.5" font-weight="400" fill="#222" text-anchor="middle">productivity</text><rect x="154" y="558" width="570" height="125" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><rect x="162" y="566" width="24" height="14" rx="7" fill="#fff" stroke="#777" stroke-width="1"/><text x="174" y="576" font-size="8" font-weight="400" fill="#222" text-anchor="middle">AI-assisted coding · RQ1</text><rect x="192" y="566" width="92.2" height="14" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="238.1" y="576" font-size="8" font-weight="700" fill="#222" text-anchor="middle">✗ Contradicts</text><text x="162" y=