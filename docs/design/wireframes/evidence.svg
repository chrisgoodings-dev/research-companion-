n list is grouped by project with &lt;optgroup&gt; and</text><text x="42" y="1054" font-size="10" font-weight="400" fill="#222" text-anchor="start">narrows when a project is chosen. A paper filter lets the matrix drill straight to one</text><text x="42" y="1067" font-size="10" font-weight="400" fill="#222" text-anchor="start">cell's evidence. State is kept in the address, so a filtered view can be bookmarked or</text><text x="42" y="1080" font-size="10" font-weight="400" fill="#222" text-anchor="start">linked from the matrix and progress pages.</text><circle cx="538" cy="1038" r="8" fill="#c0392b"/><text x="538" y="1042" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="1041" font-size="10" font-weight="400" fill="#222" text-anchor="start">Totals by relationship are stated as text. Each card names its project and question,</text><text x="552" y="1054" font-size="10" font-weight="400" fill="#222" text-anchor="start">links to the paper's Evidence tab, and keeps "from the paper" and "your</text><text x="552" y="1067" font-size="10" font-weight="400" fill="#222" text-anchor="start">interpretation" visually separate.</text></svg>