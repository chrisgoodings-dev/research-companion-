<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1063" viewBox="0 0 1040 1063" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="26" font-size="18" font-weight="700" fill="#111">Backup and export</text><text x="20" y="44" font-size="11" fill="#555">Route #/backup   ·   js/views/backup.js</text><text x="20" y="62" font-size="10" font-weight="700" fill="#666">DESKTOP AND TABLET (768px and wider)</text><text x="780" y="62" font-size="10" font-weight="700" fill="#666">PHONE (320px)</text><rect x="20" y="70" width="720" height="669" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><rect x="20" y="70" width="118" height="669" rx="0" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="32" y="94" font-size="10.5" font-weight="700" fill="#fff" text-anchor="start">SE Research Hub</text><text x="36" y="123" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Dashboard</text><text x="36" y="149" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Projects</text><text x="36" y="175" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Discover</text><text x="36" y="201" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Library</text><text x="36" y="227" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Evidence</text><text x="36" y="253" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Matrix</text><text x="36" y="279" font-size="10" font-weight="400" fill="#fff" text-anchor="start">Progress</text><text x="32" y="725" font-size="9.5" font-weight="700" fill="#fff" text-anchor="start">Backup &amp; export</text><line x1="26" y1="711" x2="132" y2="711" stroke="#666" stroke-width="1"/><rect x="628" y="80" width="98" height="22" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="677" y="95" font-size="9.5" font-weight="700" fill="#222" text-anchor="middle">Dark theme</text><text x="154" y="130" font-size="17" font-weight="700" fill="#222" text-anchor="start">Backup &amp; export</text><text x="154" y="158" font-size="10" font-weight="400" fill="#555" text-anchor="start">Your research lives only in this browser. Clearing site data, or switching browser or device, would erase</text><text x="154" y="171" font-size="10" font-weight="400" fill="#555" text-anchor="start">it, so keep a backup.</text><rect x="154" y="186" width="570" height="126" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="164" y="208" font-size="12" font-weight="700" fill="#222" text-anchor="start">Back up your data</text><text x="164" y="228" font-size="10" font-weight="400" fill="#222" text-anchor="start">•</text><text x="174" y="228" font-size="10" font-weight="400" fill="#222" text-anchor="start">3 projects · 7 research questions · 18 papers</text><text x="164" y="244" font-size="10" font-weight="400" fill="#222" text-anchor="start">•</text><text x="174" y="244" font-size="10" font-weight="400" fill="#222" text-anchor="start">18 saved paper links · 42 evidence records</text><text x="164" y="267" font-size="9" font-weight="400" fill="#777" text-anchor="start" font-style="italic">Last backup downloaded 3 Oct 2026.</text><rect x="164" y="280" width="149.8" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="238.9" y="295" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Download backup (JSON)</text><circle cx="143" cy="194" r="8" fill="#c0392b"/><text x="143" y="198" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="154" y="320" width="570" height="252" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="164" y="342" font-size="12" font-weight="700" fill="#222" text-anchor="start">Restore from a backup</text><text x="164" y="362" font-size="10" font-weight="700" fill="#222" text-anchor="start">Backup file (.json, up to 20 MB)</text><text x="164" y="375" font-size="9" font-weight="400" fill="#777" text-anchor="start">Files from other apps, or edited by hand, may be refused.</text><rect x="164" y="381" width="550" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="170" y="396" font-size="10" font-weight="400" fill="#555" text-anchor="start">[Choose File]  backup-2026-10-04.json</text><rect x="164" y="411" width="550" height="151" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="174" y="431" font-size="9.5" font-weight="700" fill="#222" text-anchor="start">Backup made on 4 Oct 2026 is valid. It contains: 3 projects, 7 questions, 18 papers…</text><rect x="174" y="450" width="530" height="72" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><rect x="182" y="444" width="153" height="12" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="186" y="454" font-size="10" font-weight="700" fill="#222" text-anchor="start">How should it be restored?</text><circle cx="188" cy="463" r="5" fill="#fff" stroke="#333"/><circle cx="188" cy="463" r="2.5" fill="#333"/><text x="198" y="466" font-size="10" font-weight="700" fill="#222" text-anchor="start">Merge with my current data</text><text x="198" y="477" font-size="9" font-weight="400" fill="#777" text-anchor="start">Adds what is missing. Anything you already have is kept.</text><circle cx="188" cy="492" r="5" fill="#fff" stroke="#333"/><text x="198" y="495" font-size="10" font-weight="700" fill="#222" text-anchor="start">Replace everything</text><text x="198" y="506" font-size="9" font-weight="400" fill="#777" text-anchor="start">Deletes your current data first.</text><rect x="174" y="530" width="61.300000000000004" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="204.65" y="545" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Restore</text><circle cx="153" cy="419" r="8" fill="#c0392b"/><text x="153" y="423" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="154" y="580" width="570" height="139" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="164" y="602" font-size="12" font-weight="700" fill="#222" text-anchor="start">Export for analysis (CSV)</text><rect x="164" y="612" width="155.70000000000002" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="241.85000000000002" y="627" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Evidence (all projects)</text><rect x="325.70000000000005" y="612" width="214.70000000000002" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="433.05000000000007" y="627" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Papers and reviews (all projects)</text><text x="164" y="652" font-size="10" font-weight="700" fill="#222" text-anchor="start">Evidence matrix for project</text><rect x="164" y="657" width="550" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="170" y="672" font-size="10" font-weight="400" fill="#555" text-anchor="start">AI-assisted coding</text><text x="700" y="672" font-size="10" font-weight="400" fill="#222" text-anchor="start">▾</text><rect x="164" y="687" width="90.80000000000001" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="209.4" y="702" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Matrix (CSV)</text><circle cx="143" cy="588" r="8" fill="#c0392b"/><text x="143" y="592" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="780" y="70" width="240" height="849" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><rect x="780" y="70" width="240" height="34" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="792" y="92" font-size="10" font-weight="700" fill="#fff" text-anchor="start">SE Research Hub</text><rect x="942" y="77" width="68" height="20" rx="4" fill="#3b3b3b" stroke="#ddd" stroke-width="1"/><text x="976" y="91" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Dark theme</text><rect x="780" y="881" width="240" height="38" rx="10" fill="#3b3b3b" stroke="#222" stroke-width="2"/><text x="810" y="904" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Dashboard</text><text x="870" y="904" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Discover</text><text x="930" y="904" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Library</text><text x="990" y="904" font-size="8.5" font-weight="400" fill="#fff" text-anchor="middle">Menu</text><text x="792" y="132" font-size="17" font-weight="700" fill="#222" text-anchor="start">Backup &amp; export</text><text x="792" y="160" font-size="10" font-weight="400" fill="#555" text-anchor="start">Your research lives only in this</text><text x="792" y="173" font-size="10" font-weight="400" fill="#555" text-anchor="start">browser. Clearing site data, or</text><text x="792" y="186" font-size="10" font-weight="400" fill="#555" text-anchor="start">switching browser or device, would erase</text><text x="792" y="199" font-size="10" font-weight="400" fill="#555" text-anchor="start">it, so keep a backup.</text><rect x="792" y="214" width="216" height="152" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="236" font-size="12" font-weight="700" fill="#222" text-anchor="start">Back up your data</text><text x="802" y="256" font-size="10" font-weight="400" fill="#222" text-anchor="start">•</text><text x="812" y="256" font-size="10" font-weight="400" fill="#222" text-anchor="start">3 projects · 7 research questions</text><text x="812" y="269" font-size="10" font-weight="400" fill="#222" text-anchor="start">· 18 papers</text><text x="802" y="285" font-size="10" font-weight="400" fill="#222" text-anchor="start">•</text><text x="812" y="285" font-size="10" font-weight="400" fill="#222" text-anchor="start">18 saved paper links · 42 evidence</text><text x="812" y="298" font-size="10" font-weight="400" fill="#222" text-anchor="start">records</text><text x="802" y="321" font-size="9" font-weight="400" fill="#777" text-anchor="start" font-style="italic">Last backup downloaded 3 Oct 2026.</text><rect x="802" y="334" width="149.8" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="876.9" y="349" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Download backup (JSON)</text><circle cx="781" cy="222" r="8" fill="#c0392b"/><text x="781" y="226" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="792" y="374" width="216" height="322" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="396" font-size="12" font-weight="700" fill="#222" text-anchor="start">Restore from a backup</text><text x="802" y="416" font-size="10" font-weight="700" fill="#222" text-anchor="start">Backup file (.json, up to 20 MB)</text><text x="802" y="429" font-size="9" font-weight="400" fill="#777" text-anchor="start">Files from other apps, or edited by</text><text x="802" y="440" font-size="9" font-weight="400" fill="#777" text-anchor="start">hand, may be refused.</text><rect x="802" y="446" width="196" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="808" y="461" font-size="10" font-weight="400" fill="#555" text-anchor="start">[Choose File]  backup-2026-10-04.json</text><rect x="802" y="476" width="196" height="210" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="812" y="496" font-size="9.5" font-weight="700" fill="#222" text-anchor="start">Backup made on 4 Oct 2026 is</text><text x="812" y="509" font-size="9.5" font-weight="700" fill="#222" text-anchor="start">valid. It contains: 3 projects, 7</text><text x="812" y="522" font-size="9.5" font-weight="700" fill="#222" text-anchor="start">questions, 18 papers…</text><rect x="812" y="541" width="176" height="105" rx="4" fill="#fff" stroke="#888" stroke-width="1"/><rect x="820" y="535" width="153" height="12" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="824" y="545" font-size="10" font-weight="700" fill="#222" text-anchor="start">How should it be restored?</text><circle cx="826" cy="554" r="5" fill="#fff" stroke="#333"/><circle cx="826" cy="554" r="2.5" fill="#333"/><text x="836" y="557" font-size="10" font-weight="700" fill="#222" text-anchor="start">Merge with my current data</text><text x="836" y="568" font-size="9" font-weight="400" fill="#777" text-anchor="start">Adds what is missing.</text><text x="836" y="579" font-size="9" font-weight="400" fill="#777" text-anchor="start">Anything you already have is</text><text x="836" y="590" font-size="9" font-weight="400" fill="#777" text-anchor="start">kept.</text><circle cx="826" cy="605" r="5" fill="#fff" stroke="#333"/><text x="836" y="608" font-size="10" font-weight="700" fill="#222" text-anchor="start">Replace everything</text><text x="836" y="619" font-size="9" font-weight="400" fill="#777" text-anchor="start">Deletes your current data</text><text x="836" y="630" font-size="9" font-weight="400" fill="#777" text-anchor="start">first.</text><rect x="812" y="654" width="61.300000000000004" height="22" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/><text x="842.65" y="669" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Restore</text><circle cx="791" cy="484" r="8" fill="#c0392b"/><text x="791" y="488" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="792" y="704" width="216" height="167" rx="4" fill="#fff" stroke="#555" stroke-width="1"/><text x="802" y="726" font-size="12" font-weight="700" fill="#222" text-anchor="start">Export for analysis (CSV)</text><rect x="802" y="736" width="155.70000000000002" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="879.85" y="751" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Evidence (all projects)</text><rect x="802" y="764" width="196" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="900" y="779" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Papers and reviews (all projects)</text><text x="802" y="804" font-size="10" font-weight="700" fill="#222" text-anchor="start">Evidence matrix for project</text><rect x="802" y="809" width="196" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="1"/><text x="808" y="824" font-size="10" font-weight="400" fill="#555" text-anchor="start">AI-assisted coding</text><text x="984" y="824" font-size="10" font-weight="400" fill="#222" text-anchor="start">▾</text><rect x="802" y="839" width="90.80000000000001" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="847.4" y="854" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Matrix (CSV)</text><circle cx="781" cy="712" r="8" fill="#c0392b"/><text x="781" y="716" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="20" y="949" font-size="12" font-weight="700" fill="#222" text-anchor="start">Annotations</text><circle cx="28" cy="968" r="8" fill="#c0392b"/><text x="28" y="972" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="971" font-size="10" font-weight="400" fill="#222" text-anchor="start">Downloads one JSON file (a local Blob link; nothing is uploaded). The date of the last</text><text x="42" y="984" font-size="10" font-weight="400" fill="#222" text-anchor="start">backup is shown here and on the dashboard.</text><circle cx="538" cy="968" r="8" fill="#c0392b"/><text x="538" y="972" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="552" y="971" font-size="10" font-weight="400" fill="#222" text-anchor="start">A restored file is treated as untrusted. It is fully validated and PREVIEWED before</text><text x="552" y="984" font-size="10" font-weight="400" fill="#222" text-anchor="start">anything changes; an invalid file lists up to 25 problems with exact locations and</text><text x="552" y="997" font-size="10" font-weight="400" fill="#222" text-anchor="start">says "Nothing was changed". Merge (the safe default) keeps existing records; Replace</text><text x="552" y="1010" font-size="10" font-weight="400" fill="#222" text-anchor="start">asks for confirmation with Cancel focused. The whole restore is one transaction, so it</text><text x="552" y="1023" font-size="10" font-weight="400" fill="#222" text-anchor="start">happens completely or not at all.</text><circle cx="28" cy="1012" r="8" fill="#c0392b"/><text x="28" y="1016" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="42" y="1015" font-size="10" font-weight="400" fill="#222" text-anchor="start">CSV files open in a spreadsheet. Cells that could be run as formulas (starting = + -</text><text x="42" y="1028" font-size="10" font-weight="400" fill="#222" text-anchor="start">@) are neutralised; files carry a byte-order mark so Excel reads them as UTF-8.</text></svg>